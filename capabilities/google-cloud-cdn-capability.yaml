      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: backendService
        type: string
        description: backendService
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_CDN_TOKEN: GOOGLE_CLOUD_CDN_TOKEN
