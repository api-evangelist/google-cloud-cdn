naftiko: 1.0.0-alpha2
info:
  label: Google Cloud CDN API
  description: Manages Cloud CDN resources including backend services with CDN enabled, URL maps, and cache invalidation through
    the Compute Engine API.
  tags:
  - Google
  - Cloud
  - Cdn
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-cloud-cdn
    baseUri: https://compute.googleapis.com/compute/v1
    description: Google Cloud CDN API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_CLOUD_CDN_TOKEN}}'
    resources:
    - name: projects-project-global-backendservices
      path: /projects/{project}/global/backendServices
      operations:
      - name: listbackendservices
        method: GET
        description: Google Cloud CDN List Backend Services
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: insertbackendservice
        method: POST
        description: Google Cloud CDN Create Backend Service
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-global-backendservices-backends
      path: /projects/{project}/global/backendServices/{backendService}
      operations:
      - name: getbackendservice
        method: GET
        description: Google Cloud CDN Get Backend Service
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: backendService
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchbackendservice
        method: PATCH
        description: Google Cloud CDN Update Backend Service
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: backendService
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletebackendservice
        method: DELETE
        description: Google Cloud CDN Delete Backend Service
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: backendService
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-global-urlmaps
      path: /projects/{project}/global/urlMaps
      operations:
      - name: listurlmaps
        method: GET
        description: Google Cloud CDN List URL Maps
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project-global-backendservices-backends
      path: /projects/{project}/global/backendServices/{backendService}/invalidateCache
      operations:
      - name: invalidatecache
        method: POST
        description: Google Cloud CDN Invalidate Cache
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: backendService
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-cloud-cdn-rest
    description: REST adapter for Google Cloud CDN API.
    resources:
    - path: /projects/{project}/global/backendServices
      name: listbackendservices
      operations:
      - method: GET
        name: listbackendservices
        description: Google Cloud CDN List Backend Services
        call: google-cloud-cdn.listbackendservices
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/backendServices
      name: insertbackendservice
      operations:
      - method: POST
        name: insertbackendservice
        description: Google Cloud CDN Create Backend Service
        call: google-cloud-cdn.insertbackendservice
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/backendServices/{backendService}
      name: getbackendservice
      operations:
      - method: GET
        name: getbackendservice
        description: Google Cloud CDN Get Backend Service
        call: google-cloud-cdn.getbackendservice
        with:
          project: rest.project
          backendService: rest.backendService
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/backendServices/{backendService}
      name: patchbackendservice
      operations:
      - method: PATCH
        name: patchbackendservice
        description: Google Cloud CDN Update Backend Service
        call: google-cloud-cdn.patchbackendservice
        with:
          project: rest.project
          backendService: rest.backendService
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/backendServices/{backendService}
      name: deletebackendservice
      operations:
      - method: DELETE
        name: deletebackendservice
        description: Google Cloud CDN Delete Backend Service
        call: google-cloud-cdn.deletebackendservice
        with:
          project: rest.project
          backendService: rest.backendService
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/urlMaps
      name: listurlmaps
      operations:
      - method: GET
        name: listurlmaps
        description: Google Cloud CDN List URL Maps
        call: google-cloud-cdn.listurlmaps
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /projects/{project}/global/backendServices/{backendService}/invalidateCache
      name: invalidatecache
      operations:
      - method: POST
        name: invalidatecache
        description: Google Cloud CDN Invalidate Cache
        call: google-cloud-cdn.invalidatecache
        with:
          project: rest.project
          backendService: rest.backendService
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-cloud-cdn-mcp
    transport: http
    description: MCP adapter for Google Cloud CDN API for AI agent use.
    tools:
    - name: listbackendservices
      description: Google Cloud CDN List Backend Services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-cdn.listbackendservices
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: insertbackendservice
      description: Google Cloud CDN Create Backend Service
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-cloud-cdn.insertbackendservice
      with:
        project: tools.project
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getbackendservice
      description: Google Cloud CDN Get Backend Service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-cdn.getbackendservice
      with:
        project: tools.project
        backendService: tools.backendService
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: backendService
        type: string
        description: backendService
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: patchbackendservice
      description: Google Cloud CDN Update Backend Service
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-cloud-cdn.patchbackendservice
      with:
        project: tools.project
        backendService: tools.backendService
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: backendService
        type: string
        description: backendService
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deletebackendservice
      description: Google Cloud CDN Delete Backend Service
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: google-cloud-cdn.deletebackendservice
      with:
        project: tools.project
        backendService: tools.backendService
      inputParameters:
      - name: project
        type: string
        description: project
        required: true
      - name: backendService
        type: string
        description: backendService
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listurlmaps
      description: Google Cloud CDN List URL Maps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-cdn.listurlmaps
      with:
        project: tools.project
      inputParameters:
      - name: project
