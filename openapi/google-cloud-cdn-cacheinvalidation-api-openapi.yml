openapi: 3.1.0
info:
  title: Google Cloud CDN BackendServices CacheInvalidation API
  description: Manages Cloud CDN resources including backend services with CDN enabled, URL maps, and cache invalidation through the Compute Engine API.
  version: 1.0.0
  contact:
    name: Google Cloud
    url: https://cloud.google.com/cdn
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://compute.googleapis.com/compute/v1
  description: Google Compute Engine API v1 (Cloud CDN is managed via Compute Engine)
security:
- oauth2:
  - https://www.googleapis.com/auth/compute
tags:
- name: CacheInvalidation
  description: Invalidate cached content
paths:
  /projects/{project}/global/backendServices/{backendService}/invalidateCache:
    post:
      operationId: invalidateCache
      summary: Google Cloud CDN Invalidate Cache
      description: Initiates a cache invalidation operation, invalidating the specified path.
      tags:
      - CacheInvalidation
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: backendService
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheInvalidationRule'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
components:
  schemas:
    Operation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        operationType:
          type: string
        status:
          type: string
        targetLink:
          type: string
        progress:
          type: integer
        insertTime:
          type: string
          format: date-time
    CacheInvalidationRule:
      type: object
      properties:
        path:
          type: string
        host:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/compute: Full access to Compute Engine
            https://www.googleapis.com/auth/cloud-platform: Full access to Google Cloud Platform
