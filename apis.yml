apis:
  - name: Google Cloud CDN API
    description: >-
      The Cloud CDN API enables programmatic management of CDN-enabled backend services, URL maps, cache invalidation,
      and edge caching policies through the Compute Engine API, providing control over content distribution and caching
      behavior.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
